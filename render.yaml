services:
  - type: web
    name: cr8veresearch-mcp
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    rootDir: mcp-server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: BEDROCK_MODEL_ID
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SESSION_TOKEN
        sync: false
      - key: AGENT_MODEL_PROVIDER
        sync: false
      - key: AGENT_ALLOWED_ORIGIN
        sync: false
      - key: NODE_ENV
        sync: false

  - type: web
    name: cr8veresearch-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_AGENT_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
